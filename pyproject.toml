[project]
name = "mite_extras"
version = "1.6.5"
description = "Parsing, conversion, and validation functionality for Minimum Information about a Tailoring Enzyme (MITE) files."
readme = "README.md"
requires-python = ">=3.12.0,<3.13.0"  # because of rdkit 2024
license-files = ["LICENSE"]
authors = [
  { name = "Mitja M. Zdouc", email = "zdoucmm@gmail.com" },
  { name = "Adriano Rutz", email = "adafede@gmail.com" }
]
keywords = ["cheminformatics", "genomics"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Chemistry"
]
dependencies = [
  "coloredlogs~=15.0",
  "json-repair~=0.51",
  "mite-schema>=1.8.4",
  "pydantic~=2.11",
  "rdkit==2024.3.6",
  "requests~=2.32",
]

[project.urls]
Github = "https://github.com/mite-standard/mite_extras"
Homepage = "https://mite.bioinformatics.nl/"
Issues = "https://github.com/mite-standard/mite_extras/issues"

[project.scripts]
mite_extras = "mite_extras.main:main_cli"

[dependency-groups]
dev = [
  "pre-commit~=4.3",
  "pytest~=8.4",
  "ruff~=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  # flake8-bugbear
  "B",
  # flake8-comprehensions
  "C4",
  # flake8-eradicate/eradicate
  "ERA",
  # isort
  "I",
  # pep8-naming
  "N",
  # flake8-pie
  "PIE",
  # pygrep
  "PGH",
  # ruff checks
  "RUF",
  # flake8-simplify
  "SIM",
  # flake8-tidy-imports
  "TID",
  # pyupgrade
  "UP",
]
ignore = [
  # whitespace-before-punctuation
  "E203",
  # percent-format-invalid-format
  "E501",
  # mixed-case-variable-in-class-scope
  "N815",
  # needless-boool
  "SIM103"
]
